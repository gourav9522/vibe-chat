name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Clone Template and Inject HTML
      run: |
        git clone https://github.com/raisul/Android-WebView-Template.git android-project
        cd android-project
        
        # Apni index.html ko assets folder mein copy karna
        mkdir -p app/src/main/assets
        cp ../index.html app/src/main/assets/index.html
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android-project/app/build/outputs/apk/debug/app-debug.apk
