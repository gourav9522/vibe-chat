name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Basic Android Project Structure
      run: |
        mkdir -p android-app/app/src/main/assets
        mkdir -p android-app/app/src/main/java/com/apk/earning
        mkdir -p android-app/app/src/main/res/mipmap

        cp index.html android-app/app/src/main/assets/

        cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.apk.earning">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:allowBackup="true"
                android:label="APK Earner"
                android:theme="@android:style/Theme.NoTitleBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > android-app/app/src/main/java/com/apk/earning/MainActivity.java
        package com.apk.earning;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.content.Intent;
        import android.net.Uri;

        public class MainActivity extends Activity {
            private WebView myWebView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                myWebView = new WebView(this);
                setContentView(myWebView);
                WebSettings webSettings = myWebView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setAllowFileAccess(true);
                webSettings.setAllowContentAccess(true);
                myWebView.setWebViewClient(new WebViewClient() {
                    @Override
                    public boolean shouldOverrideUrlLoading(WebView view, String url) {
                        if (url.startsWith("http://") || url.startsWith("https://")) {
                            view.getContext().startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                            return true;
                        }
                        return false;
                    }
                });
                myWebView.loadUrl("file:///android_asset/index.html");
            }
            @Override
            public void onBackPressed() {
                if (myWebView.canGoBack()) { myWebView.goBack(); }
                else { super.onBackPressed(); }
            }
        }
        EOF

        cat << 'EOF' > android-app/build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat << 'EOF' > android-app/settings.gradle
        include ':app'
        rootProject.name = "APK Earner"
        EOF

        cat << 'EOF' > android-app/app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdk 33
            defaultConfig {
                applicationId "com.apk.earning"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies { implementation 'androidx.appcompat:appcompat:1.6.0' }
        EOF

        echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties

    - name: Build APK with Gradle
      run: |
        cd android-app
        chmod +x gradlew || true
        gradle wrapper
        ./gradlew assembleDebug

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
