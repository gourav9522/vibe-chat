<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeChat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs (Compat version for easy single-file setup) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .hide { display: none !important; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <!-- TOP POPUP NOTIFICATION (Instagram Style) -->
    <div id="topPopup" class="fixed top-4 left-4 right-4 bg-slate-800 border border-slate-700 p-3 rounded-2xl shadow-2xl flex items-center space-x-3 transition-all duration-300 -translate-y-24 z-50">
        <div id="popupAvatar" class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center font-bold text-lg">VC</div>
        <div class="flex-1 overflow-hidden">
            <h4 id="popupTitle" class="text-sm font-semibold text-indigo-400">Sender Name</h4>
            <p id="popupText" class="text-xs text-slate-300 truncate">New message text here...</p>
        </div>
    </div>

    <!-- 1. LOGIN SCREEN -->
    <div id="loginScreen" class="flex flex-col items-center justify-center h-full p-6 text-center">
        <img src="https://archive.org/download/vibe_20260921/image_f8fcaf71~3.jpg" class="w-20 h-20 rounded-3xl shadow-lg mb-6 object-cover shadow-indigo-500/30" alt="VibeChat Logo">
        <h1 class="text-3xl font-bold mb-2">VibeChat</h1>
        <p class="text-slate-400 mb-8 text-sm">Connect with friends, chat privately, and join random rooms instantly.</p>
        <button onclick="loginWithGoogle()" class="w-full max-w-sm bg-white text-slate-900 font-semibold py-3.5 px-6 rounded-xl flex items-center justify-center space-x-3 shadow-md active:scale-95 transition-transform">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            <span>Continue with Google</span>
        </button>
    </div>

    <!-- 2. PROFILE SETUP SCREEN -->
    <div id="profileScreen" class="flex flex-col items-center justify-center h-full p-6 text-center hide">
        <h2 class="text-2xl font-bold mb-2">Complete Your Profile</h2>
        <p class="text-slate-400 mb-6 text-sm">Tell others a bit about yourself</p>
        <div class="w-full max-w-sm space-y-4 text-left">
            <div>
                <label class="text-xs text-slate-400 mb-1 block">Your Name</label>
                <input type="text" id="setupName" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="text-xs text-slate-400 mb-1 block">Gender</label>
                <select id="setupGender" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <button onclick="saveProfile()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3.5 rounded-xl text-white shadow-lg shadow-indigo-600/30 transition-all">Start Chatting</button>
        </div>
    </div>

    <!-- 3. MAIN DASHBOARD (Chats & Rooms) -->
    <div id="mainDashboard" class="flex flex-col h-full hide">
        <!-- Header -->
        <header class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-pink-500 bg-clip-text text-transparent">VibeChat</h1>
            <div class="flex space-x-2">
                <button onclick="switchTab('chats')" id="tabChatsBtn" class="px-4 py-1.5 rounded-lg text-sm font-semibold bg-indigo-600 text-white">Chats</button>
                <button onclick="switchTab('rooms')" id="tabRoomsBtn" class="px-4 py-1.5 rounded-lg text-sm font-semibold text-slate-400">Rooms</button>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-4">
            <!-- CHATS TAB -->
            <div id="chatsTabContent">
                <input type="text" id="searchUser" oninput="searchUsers()" placeholder="Search user ID or name..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white mb-4 focus:outline-none focus:border-indigo-500">
                <div id="userList" class="space-y-2">
                    <!-- Dynamic Users List -->
                </div>
            </div>

            <!-- ROOMS TAB -->
            <div id="roomsTabContent" class="hide">
                <button onclick="createRoom()" class="w-full bg-gradient-to-r from-indigo-600 to-pink-600 text-white font-semibold py-3 rounded-xl mb-4 shadow-md">+ Create Random Room</button>
                <div id="roomsList" class="space-y-3">
                    <!-- Dynamic Rooms List -->
                </div>
            </div>
        </div>
    </div>

    <!-- 4. CHAT WINDOW -->
    <div id="chatWindow" class="flex flex-col h-full bg-slate-900 hide">
        <div class="p-4 bg-slate-800 border-b border-slate-700 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button onclick="closeChat()" class="text-slate-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <div>
                    <h3 id="activeChatName" class="font-semibold text-sm">User Name</h3>
                    <span id="activeChatStatus" class="text-xs text-emerald-400">Online</span>
                </div>
            </div>
        </div>

        <div id="messageContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- Messages load here -->
        </div>

        <div class="p-3 bg-slate-800 border-t border-slate-700 flex items-center space-x-2">
            <input type="file" id="mediaInput" class="hide" onchange="sendMedia(this)">
            <button onclick="document.getElementById('mediaInput').click()" class="p-2 text-slate-400 hover:text-indigo-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
            </button>
            <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            <button onclick="sendMessage()" class="bg-indigo-600 px-4 py-2.5 rounded-xl font-semibold text-sm hover:bg-indigo-500">Send</button>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // Firebase Configuration (Provided by user)
        const firebaseConfig = {
            apiKey: "AIzaSyDj-2kVhmOOsYxKp9ChB2ATmJMiQvPysrA",
            authDomain: "vibe-chat-ee27e.firebaseapp.com",
            projectId: "vibe-chat-ee27e",
            storageBucket: "vibe-chat-ee27e.firebasestorage.app",
            messagingSenderId: "891909676621",
            appId: "1:891909676621:web:97cd033dac7cfb10fb4604",
            measurementId: "G-304XJYYHEG"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const storage = firebase.storage();

        let currentUser = null;
        let currentChatUser = null;

        // Auth state persistence check
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                checkUserProfile(user.uid);
            } else {
                document.getElementById('loginScreen').classList.remove('hide');
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => alert(error.message));
        }

        function checkUserProfile(uid) {
            db.ref('users/' + uid).once('value', snapshot => {
                if (snapshot.exists()) {
                    document.getElementById('loginScreen').classList.add('hide');
                    document.getElementById('profileScreen').classList.add('hide');
                    document.getElementById('mainDashboard').classList.remove('hide');
                    loadUsers();
                    updateStatus('Online');
                } else {
                    document.getElementById('loginScreen').classList.add('hide');
                    document.getElementById('profileScreen').classList.remove('hide');
                }
            });
        }

        function saveProfile() {
            const name = document.getElementById('setupName').value;
            const gender = document.getElementById('setupGender').value;
            if(!name) return alert('Please enter your name');

            db.ref('users/' + currentUser.uid).set({
                uid: currentUser.uid,
                name: name,
                gender: gender,
                email: currentUser.email,
                photo: currentUser.photoURL || ''
            }, () => {
                location.reload();
            });
        }

        function updateStatus(status) {
            if(currentUser) {
                db.ref('users/' + currentUser.uid + '/status').set(status);
            }
        }

        window.addEventListener('beforeunload', () => updateStatus('Offline'));

        function switchTab(tab) {
            if(tab === 'chats') {
                document.getElementById('chatsTabContent').classList.remove('hide');
                document.getElementById('roomsTabContent').classList.add('hide');
                document.getElementById('tabChatsBtn').className = "px-4 py-1.5 rounded-lg text-sm font-semibold bg-indigo-600 text-white";
                document.getElementById('tabRoomsBtn').className = "px-4 py-1.5 rounded-lg text-sm font-semibold text-slate-400";
            } else {
                document.getElementById('chatsTabContent').classList.add('hide');
                document.getElementById('roomsTabContent').classList.remove('hide');
                document.getElementById('tabRoomsBtn').className = "px-4 py-1.5 rounded-lg text-sm font-semibold bg-indigo-600 text-white";
                document.getElementById('tabChatsBtn').className = "px-4 py-1.5 rounded-lg text-sm font-semibold text-slate-400";
                loadRooms();
            }
        }

        function loadUsers() {
            db.ref('users').on('value', snapshot => {
                const list = document.getElementById('userList');
                list.innerHTML = '';
                snapshot.forEach(child => {
                    const user = child.val();
                    if(user.uid !== currentUser.uid) {
                        list.innerHTML += `
                            <div onclick="openChat('${user.uid}', '${user.name}')" class="p-3 bg-slate-800 rounded-xl flex items-center justify-between cursor-pointer hover:bg-slate-700">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 bg-indigo-500 rounded-full flex items-center font-bold justify-center">${user.name[0]}</div>
                                    <div>
                                        <h4 class="font-semibold text-sm">${user.name}</h4>
                                        <p class="text-xs text-slate-400">${user.gender}</p>
                                    </div>
                                </div>
                                <span class="w-2.5 h-2.5 rounded-full ${user.status === 'Online' ? 'bg-emerald-400' : 'bg-slate-500'}"></span>
                            </div>`;
                    }
                });
            });
        }

        function openChat(uid, name) {
            currentChatUser = uid;
            document.getElementById('activeChatName').innerText = name;
            document.getElementById('mainDashboard').classList.add('hide');
            document.getElementById('chatWindow').classList.remove('hide');
            loadMessages();
        }

        function closeChat() {
            currentChatUser = null;
            document.getElementById('chatWindow').classList.add('hide');
            document.getElementById('mainDashboard').classList.remove('hide');
        }

        function sendMessage() {
            const text = document.getElementById('messageInput').value;
            if(!text) return;

            const chatId = [currentUser.uid, currentChatUser].sort().join('_');
            const messageData = {
                sender: currentUser.uid,
                text: text,
                timestamp: Date.now()
            };

            db.ref('chats/' + chatId).push(messageData);
            document.getElementById('messageInput').value = '';
            
            // Local storage backup
            let localChat = JSON.parse(localStorage.getItem(chatId) || '[]');
            localChat.push(messageData);
            localStorage.setItem(chatId, JSON.stringify(localChat));
        }

        function loadMessages() {
            const chatId = [currentUser.uid, currentChatUser].sort().join('_');
            db.ref('chats/' + chatId).on('value', snapshot => {
                const container = document.getElementById('messageContainer');
                container.innerHTML = '';
                const now = Date.now();
                const sevenDaysMs = 7 * 24 * 60 * 60 * 1000;

                snapshot.forEach(child => {
                    const msg = child.val();
                    // 7-day auto delete check on cloud display
                    if(now - msg.timestamp < sevenDaysMs) {
                        const isMe = msg.sender === currentUser.uid;
                        container.innerHTML += `
                            <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                                <div class="max-w-xs p-3 rounded-2xl text-sm ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none'}">
                                    ${msg.text}
                                    <div class="text-[10px] text-right mt-1 opacity-60">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                                </div>
                            </div>`;
                    } else {
                        // Delete from firebase if older than 7 days
                        child.ref.remove();
                    }
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function sendMedia(input) {
            const file = input.files[0];
            if(!file) return;
            const storageRef = storage.ref('media/' + Date.now() + '_' + file.name);
            storageRef.put(file).then(snapshot => {
                snapshot.ref.getDownloadURL().then(url => {
                    const chatId = [currentUser.uid, currentChatUser].sort().join('_');
                    db.ref('chats/' + chatId).push({
                        sender: currentUser.uid,
                        text: `<a href="${url}" target="_blank" class="underline text-indigo-300">View Attachment</a>`,
                        timestamp: Date.now()
                    });
                });
            });
        }

        function createRoom() {
            const roomName = prompt("Enter Room Name:");
            if(!roomName) return;
            db.ref('rooms').push({
                name: roomName,
                creator: currentUser.uid,
                timestamp: Date.now()
            });
            loadRooms();
        }

        function loadRooms() {
            db.ref('rooms').on('value', snapshot => {
                const list = document.getElementById('roomsList');
                list.innerHTML = '';
                snapshot.forEach(child => {
                    const room = child.val();
                    list.innerHTML += `
                        <div class="p-4 bg-slate-800 rounded-xl flex items-center justify-between">
                            <div>
                                <h4 class="font-semibold text-sm">${room.name}</h4>
                                <p class="text-xs text-slate-400">Random Public Room</p>
                            </div>
                            <button onclick="alert('Joined room successfully!')" class="bg-indigo-600 px-3 py-1.5 rounded-lg text-xs font-semibold">Join</button>
                        </div>`;
                });
            });
        }
    </script>
</body>
</html>
