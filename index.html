<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeChat Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #090d16, #161233, #2b0312); color: #f8fafc; }
        .hide { display: none !important; }
        ::-webkit-scrollbar { height: 4px; width: 4px; }
        ::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <!-- 1. LOGIN SCREEN (Direct Google Select) -->
    <div id="loginScreen" class="flex flex-col items-center justify-center h-full p-6 text-center overflow-y-auto">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-pink-500/10 via-transparent to-transparent pointer-events-none"></div>
        <img src="https://archive.org/download/vibe_20260921/image_f8fcaf71~3.jpg" class="w-20 h-20 rounded-3xl shadow-lg mb-4 object-cover shadow-pink-500/30" alt="Logo">
        <h1 class="text-3xl font-bold mb-2 bg-gradient-to-r from-pink-400 to-indigo-400 bg-clip-text text-transparent">VibeChat Pro</h1>
        <p class="text-slate-400 mb-6 text-sm">Instant social & live connections.</p>
        
        <div class="w-full max-w-sm space-y-4 z-10">
            <button onclick="loginWithGoogle()" class="w-full bg-white text-slate-900 font-semibold py-3.5 px-6 rounded-xl flex items-center justify-center space-x-3 shadow-md active:scale-95 transition-transform">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                <span>Continue with Google</span>
            </button>
            <a href="https://accounts.google.com/signup" target="_blank" class="block text-xs text-pink-400 hover:underline">Don't have Gmail? Create new account</a>
        </div>
    </div>

    <!-- 2. PROFILE SETUP SCREEN -->
    <div id="profileScreen" class="flex flex-col items-center justify-center h-full p-6 text-center hide overflow-y-auto">
        <h2 class="text-2xl font-bold mb-2">Setup Your Profile</h2>
        <div class="w-full max-w-sm space-y-4 text-left">
            <div>
                <label class="text-xs text-slate-400 mb-1 block">Profile Photo</label>
                <input type="file" id="setupPhotoFile" accept="image/*" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-2 text-sm text-slate-300">
            </div>
            <div>
                <label class="text-xs text-slate-400 mb-1 block">Name</label>
                <input type="text" id="setupName" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500">
            </div>
            <div>
                <label class="text-xs text-slate-400 mb-1 block">Username</label>
                <input type="text" id="setupUsername" placeholder="e.g. vibe_master" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500">
            </div>
            <button onclick="saveProfileData()" class="w-full bg-gradient-to-r from-pink-600 to-indigo-600 font-semibold py-3.5 rounded-xl text-white shadow-lg">Save & Continue</button>
        </div>
    </div>

    <!-- 3. MAIN DASHBOARD -->
    <div id="mainDashboard" class="flex flex-col h-full hide bg-slate-950/60 backdrop-blur-md">
        <header class="p-4 bg-slate-900/80 border-b border-slate-800 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <button onclick="toggleSidebar(true)" id="headerProfileBtn" class="w-9 h-9 rounded-full bg-pink-600 overflow-hidden flex items-center justify-center font-bold border border-pink-400">P</button>
                <h1 class="text-xl font-bold bg-gradient-to-r from-pink-400 to-indigo-400 bg-clip-text text-transparent">VibeChat</h1>
            </div>
            <div class="flex space-x-1">
                <button onclick="switchTab('chats')" id="tabChatsBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-pink-600 text-white shadow">Chats</button>
                <button onclick="switchTab('home')" id="tabHomeBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400">Home</button>
                <button onclick="switchTab('rooms')" id="tabRoomsBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400">Rooms</button>
            </div>
        </header>

        <!-- CHATS TAB -->
        <div id="chatsTabContent" class="flex-1 overflow-y-auto p-4 space-y-3">
            <input type="text" id="searchChatUser" oninput="searchChats()" placeholder="Search active chats..." class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white mb-2 focus:outline-none focus:border-pink-500">
            <div id="activeChatList" class="space-y-2"></div>
        </div>

        <!-- HOME TAB -->
        <div id="homeTabContent" class="flex-1 overflow-y-auto p-4 space-y-4 hide">
            <div>
                <h3 class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">Online Users 🔥</h3>
                <div id="horizontalOnlineList" class="flex space-x-3 overflow-x-auto pb-2 scroll-smooth" dir="rtl"></div>
            </div>
            <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Live Rooms 🎤</h3>
                <div id="homeRoomsList" class="space-y-2"></div>
            </div>
        </div>

        <!-- ROOMS TAB -->
        <div id="roomsTabContent" class="flex-1 overflow-y-auto p-4 space-y-3 hide">
            <button onclick="openCreateRoomModal()" class="w-full bg-gradient-to-r from-pink-600 to-indigo-600 text-white font-semibold py-3 rounded-xl shadow-md">+ Create Room</button>
            <div id="roomsList" class="space-y-3"></div>
        </div>
    </div>

    <!-- CREATE ROOM MODAL (With Criteria & Type) -->
    <div id="createRoomModal" class="fixed inset-0 bg-black/80 z-50 hide flex items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-3xl w-full max-w-sm space-y-4">
            <div class="flex justify-between items-center"><h3 class="font-bold text-md text-pink-400">Create New Room</h3><button onclick="document.getElementById('createRoomModal').classList.add('hide')" class="text-slate-400 font-bold">&times;</button></div>
            <input type="text" id="roomTitleInput" placeholder="Room Title (e.g. Music Lovers)" class="w-full bg-slate-800 p-3 rounded-xl text-xs text-white">
            <textarea id="roomCriteriaInput" placeholder="Room Criteria / Rules (e.g. Respect everyone, 18+ only)" class="w-full bg-slate-800 p-3 rounded-xl text-xs text-white h-20"></textarea>
            <select id="roomTypeInput" class="w-full bg-slate-800 p-3 rounded-xl text-xs text-white">
                <option value="audio">Audio Call Room</option>
                <option value="video">Video Call Room</option>
                <option value="chat">Normal Chat Room</option>
            </select>
            <button onclick="submitCreateRoom()" class="w-full bg-pink-600 py-3 rounded-xl font-semibold text-xs text-white">Launch Room</button>
        </div>
    </div>

    <!-- ROOM VIEW & CRITERIA SCREEN -->
    <div id="roomViewScreen" class="fixed inset-0 bg-slate-950 z-50 hide flex flex-col justify-between p-4">
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
            <div>
                <h2 id="viewRoomTitle" class="font-bold text-sm text-white"></h2>
                <p id="viewRoomCriteria" class="text-[10px] text-pink-400 mt-1"></p>
            </div>
            <button onclick="exitActiveRoom()" class="bg-rose-600 px-3 py-1.5 rounded-xl text-xs font-semibold text-white">Exit Room</button>
        </div>
        <div id="roomMediaContainer" class="flex-1 flex flex-col items-center justify-center space-y-4">
            <div id="roomVideoFeed" class="w-full max-w-xs h-64 bg-slate-900 rounded-3xl border border-slate-800 flex items-center justify-center overflow-hidden relative hide">
                <video id="localVideoElement" autoplay playsinline muted class="w-full h-full object-cover"></video>
            </div>
            <p id="roomStatusText" class="text-xs text-emerald-400 animate-pulse">Connected to live stream...</p>
        </div>
        <div class="p-3 bg-slate-900 rounded-2xl flex justify-center space-x-4">
            <button onclick="toggleMicrophone()" class="bg-slate-800 p-3 rounded-full text-white text-sm">🎙️ Mic</button>
            <button onclick="toggleLoudspeaker()" class="bg-slate-800 p-3 rounded-full text-white text-sm">🔊 Speaker</button>
        </div>
    </div>

    <!-- SIDEBAR PROFILE DRAWER (Followers / Following List) -->
    <div id="sidebarDrawer" class="fixed inset-0 bg-black/70 z-50 hide flex">
        <div class="w-80 bg-slate-900 h-full p-5 flex flex-col justify-between border-r border-slate-800 overflow-y-auto">
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-lg text-pink-400">My Profile</h2>
                    <button onclick="toggleSidebar(false)" class="text-slate-400 text-xl font-bold">&times;</button>
                </div>
                <div class="flex flex-col items-center text-center space-y-2">
                    <div class="relative">
                        <img id="sidebarPhoto" src="" class="w-20 h-20 rounded-full object-cover border-2 border-pink-500 shadow-md">
                        <label class="absolute bottom-0 right-0 bg-pink-600 p-1.5 rounded-full cursor-pointer text-xs">
                            📷 <input type="file" id="updatePhotoFile" accept="image/*" class="hide" onchange="updateProfilePhoto(this)">
                        </label>
                    </div>
                    <h3 id="sidebarName" class="font-semibold text-md text-white"></h3>
                    <p id="sidebarUsername" class="text-xs text-pink-400 font-medium"></p>
                    <p id="sidebarUid" class="text-[10px] text-slate-400 font-mono bg-slate-800 px-2 py-0.5 rounded"></p>
                </div>
                <!-- Followers & Following Stats Tabs -->
                <div class="grid grid-cols-2 gap-2 text-center pt-2">
                    <div onclick="openFollowList('followers')" class="bg-slate-800 p-2 rounded-xl cursor-pointer">
                        <p class="text-[10px] text-slate-400">Followers</p>
                        <span id="statFollowers" class="font-bold text-pink-400 text-sm">0</span>
                    </div>
                    <div onclick="openFollowList('following')" class="bg-slate-800 p-2 rounded-xl cursor-pointer">
                        <p class="text-[10px] text-slate-400">Following</p>
                        <span id="statFollowing" class="font-bold text-pink-400 text-sm">0</span>
                    </div>
                </div>
                <div class="border-t border-slate-800 pt-3 space-y-3">
                    <input type="text" id="editName" placeholder="Update Name" class="w-full bg-slate-800 p-2 rounded-lg text-xs text-white">
                    <input type="text" id="editUsername" placeholder="Update Username" class="w-full bg-slate-800 p-2 rounded-lg text-xs text-white">
                    <button onclick="updateProfileInfo()" class="w-full bg-pink-600 hover:bg-pink-500 py-2 rounded-lg text-xs font-semibold">Save Changes</button>
                </div>
            </div>
            <button onclick="logoutApp()" class="w-full bg-rose-600 hover:bg-rose-500 py-2.5 rounded-xl text-xs font-semibold mt-4">Logout</button>
        </div>
        <div class="flex-1" onclick="toggleSidebar(false)"></div>
    </div>

    <!-- FOLLOWERS / FOLLOWING MODAL -->
    <div id="followListModal" class="fixed inset-0 bg-black/80 z-50 hide flex items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-700 p-5 rounded-3xl w-full max-w-xs space-y-3 relative">
            <div class="flex justify-between items-center"><h3 id="followModalTitle" class="font-bold text-sm text-pink-400">List</h3><button onclick="document.getElementById('followListModal').classList.add('hide')" class="text-slate-400 font-bold">&times;</button></div>
            <div id="followUsersContainer" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>
    </div>

    <!-- USER PROFILE VIEW MODAL -->
    <div id="userProfileModal" class="fixed inset-0 bg-black/80 z-50 hide flex items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-3xl w-full max-w-xs text-center space-y-4 relative">
            <button onclick="closeUserProfileModal()" class="absolute top-3 right-4 text-slate-400 text-xl font-bold">&times;</button>
            <img id="modalUserPhoto" src="" class="w-24 h-24 rounded-full object-cover mx-auto border-2 border-pink-500 shadow-lg">
            <div>
                <h3 id="modalUserName" class="text-lg font-bold text-white"></h3>
                <p id="modalUserUsername" class="text-xs text-pink-400 font-medium"></p>
                <p id="modalUserUid" class="text-[10px] text-slate-400 font-mono mt-1"></p>
            </div>
            <div class="flex space-x-2 pt-2">
                <button id="modalFollowBtn" onclick="toggleFollowModalUser()" class="flex-1 bg-pink-600 py-2.5 rounded-xl font-semibold text-xs text-white">Follow</button>
                <button onclick="messageModalUser()" class="flex-1 bg-indigo-600 py-2.5 rounded-xl font-semibold text-xs text-white">Message</button>
            </div>
        </div>
    </div>

    <!-- 4. CHAT WINDOW -->
    <div id="chatWindow" class="flex flex-col h-full bg-slate-950 hide">
        <div class="p-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button onclick="closeChat()" class="text-slate-400 hover:text-white font-bold text-lg">&larr;</button>
                <div class="flex items-center space-x-2">
                    <div id="chatUserAvatar" class="w-8 h-8 rounded-full bg-pink-600 flex items-center justify-center text-xs font-bold overflow-hidden">U</div>
                    <div>
                        <h3 id="activeChatName" class="font-semibold text-xs text-white">User Name</h3>
                        <span id="activeChatStatus" class="text-[10px] text-emerald-400">Online</span>
                    </div>
                </div>
            </div>
            <div class="flex space-x-3">
                <button onclick="startDirectCall('audio')" class="text-emerald-400 text-sm">📞</button>
                <button onclick="startDirectCall('video')" class="text-pink-400 text-sm">📹</button>
            </div>
        </div>
        <div id="messageContainer" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <div class="p-3 bg-slate-900 border-t border-slate-800 flex items-center space-x-2">
            <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-pink-500">
            <button onclick="sendTextMessage()" class="bg-pink-600 px-4 py-2 rounded-xl font-semibold text-xs text-white">Send</button>
        </div>
    </div>

    <!-- CALL MODAL -->
    <div id="callModal" class="fixed inset-0 bg-black/80 z-50 hide flex items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-3xl w-full max-w-sm text-center space-y-4">
            <div class="w-20 h-20 bg-pink-600 rounded-full mx-auto flex items-center justify-center text-2xl font-bold animate-pulse overflow-hidden" id="callCallerPhoto">R</div>
            <h3 id="callCallerName" class="text-lg font-bold text-white">Incoming Call...</h3>
            <div class="flex space-x-4 pt-2">
                <button onclick="rejectCall()" class="flex-1 bg-rose-600 py-3 rounded-xl font-semibold text-xs text-white">Reject</button>
                <button onclick="acceptCall()" class="flex-1 bg-emerald-600 py-3 rounded-xl font-semibold text-xs text-white">Accept</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDj-2kVhmOOsYxKp9ChB2ATmJMiQvPysrA",
            authDomain: "vibe-chat-ee27e.firebaseapp.com",
            projectId: "vibe-chat-ee27e",
            storageBucket: "vibe-chat-ee27e.firebasestorage.app",
            messagingSenderId: "891909676621",
            appId: "1:891909676621:web:97cd033dac7cfb10fb4604",
            measurementId: "G-304XJYYHEG"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const storage = firebase.storage();

        let currentUser = null;
        let userData = null;
        let currentChatUser = null;
        let modalTargetUser = null;
        let activeRoomId = null;
        let localStream = null;

        function generateNumericUid() { return Math.floor(1000000 + Math.random() * 9000000).toString(); }

        const cachedUser = localStorage.getItem('vibe_user_cache');
        if(cachedUser) {
            userData = JSON.parse(cachedUser);
            auth.onAuthStateChanged(user => { if(user) currentUser = user; });
            initDashboard();
        } else {
            auth.onAuthStateChanged(user => {
                if(user) { currentUser = user; fetchUserData(user.uid); }
                else document.getElementById('loginScreen').classList.remove('hide');
            });
        }

        // Direct Google Select (No password flow)
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            auth.signInWithRedirect(provider).catch(err => alert(err.message));
        }

        auth.getRedirectResult().then(res => {
            if(res.user) { currentUser = res.user; fetchUserData(currentUser.uid); }
        });

        function fetchUserData(uid) {
            db.ref('users/' + uid).once('value', snapshot => {
                if(snapshot.exists()) {
                    userData = snapshot.val();
                    localStorage.setItem('vibe_user_cache', JSON.stringify(userData));
                    initDashboard();
                } else {
                    document.getElementById('loginScreen').classList.add('hide');
                    document.getElementById('profileScreen').classList.remove('hide');
                }
            });
        }

        function saveProfileData() {
            const name = document.getElementById('setupName').value;
            const username = document.getElementById('setupUsername').value.toLowerCase();
            const file = document.getElementById('setupPhotoFile').files[0];
            if(!name || !username) return alert('Fill required fields');
            const numericUid = generateNumericUid();

            const proceed = (photoUrl) => {
                userData = { uid: numericUid, authUid: currentUser.uid, name, username, photo: photoUrl || '', status: 'Online' };
                db.ref('users/' + currentUser.uid).set(userData, () => {
                    localStorage.setItem('vibe_user_cache', JSON.stringify(userData));
                    location.reload();
                });
            };

            if(file) {
                storage.ref('profiles/' + currentUser.uid).put(file).then(s => s.ref.getDownloadURL().then(proceed));
            } else proceed('https://archive.org/download/vibe_20260921/image_f8fcaf71~3.jpg');
        }

        // Replace profile photo & remove old
        function updateProfilePhoto(input) {
            const file = input.files[0];
            if(!file) return;
            const fileRef = storage.ref('profiles/' + currentUser.uid);
            fileRef.put(file).then(s => s.ref.getDownloadURL().then(url => {
                db.ref('users/' + currentUser.uid + '/photo').set(url, () => {
                    userData.photo = url;
                    localStorage.setItem('vibe_user_cache', JSON.stringify(userData));
                    document.getElementById('sidebarPhoto').src = url;
                    alert('Profile photo updated successfully!');
                });
            }));
        }

        function initDashboard() {
            document.getElementById('loginScreen').classList.add('hide');
            document.getElementById('profileScreen').classList.add('hide');
            document.getElementById('mainDashboard').classList.remove('hide');
            document.getElementById('sidebarPhoto').src = userData.photo;
            document.getElementById('sidebarName').innerText = userData.name;
            document.getElementById('sidebarUsername').innerText = '@' + userData.username;
            document.getElementById('sidebarUid').innerText = 'ID: ' + userData.uid;
            document.getElementById('headerProfileBtn').innerHTML = `<img src="${userData.photo}" class="w-full h-full object-cover">`;

            loadOnlineUsers();
            loadActiveChats();
            loadRooms();
            loadFollowStats();
        }

        function toggleSidebar(show) {
            document.getElementById('sidebarDrawer').classList[show ? 'remove' : 'add']('hide');
        }

        function switchTab(tab) {
            ['chats', 'home', 'rooms'].forEach(t => {
                document.getElementById(t + 'TabContent').classList.add('hide');
                document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1) + 'Btn').className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400";
            });
            document.getElementById(tab + 'TabContent').classList.remove('hide');
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1) + 'Btn').className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-pink-600 text-white shadow";
        }

        function loadOnlineUsers() {
            db.ref('users').on('value', snap => {
                const list = document.getElementById('horizontalOnlineList');
                list.innerHTML = '';
                snap.forEach(c => {
                    const u = c.val();
                    if(u.authUid !== currentUser.uid) {
                        list.innerHTML += `
                            <div onclick="openUserProfile('${u.authUid}', '${u.uid}', '${u.name}', '${u.username}', '${u.photo}')" class="flex-shrink-0 flex flex-col items-center cursor-pointer space-y-1 w-16">
                                <img src="${u.photo}" class="w-14 h-14 rounded-full object-cover border-2 border-pink-500">
                                <span class="text-[10px] text-slate-300 truncate w-full text-center">${u.name}</span>
                            </div>`;
                    }
                });
            });
        }

        function loadActiveChats() {
            db.ref('users').on('value', userSnap => {
                db.ref('chats').once('value', chatSnap => {
                    const list = document.getElementById('activeChatList');
                    list.innerHTML = '';
                    userSnap.forEach(c => {
                        const u = c.val();
                        if(u.authUid !== currentUser.uid) {
                            const chatId = [currentUser.authUid, u.authUid].sort().join('_');
                            if(chatSnap.hasChild(chatId)) {
                                list.innerHTML += `
                                    <div onclick="openChat('${u.authUid}', '${u.name}', '${u.photo}')" class="p-3 bg-slate-900 border border-slate-800 rounded-2xl flex items-center justify-between cursor-pointer">
                                        <div class="flex items-center space-x-3">
                                            <img src="${u.photo}" class="w-11 h-11 rounded-full object-cover">
                                            <div><h4 class="font-semibold text-sm text-white">${u.name}</h4><p class="text-[10px] text-pink-400">@${u.username}</p></div>
                                        </div>
                                    </div>`;
                            }
                        }
                    });
                });
            });
        }

        function searchChats() {
            const q = document.getElementById('searchChatUser').value.toLowerCase();
            db.ref('users').once('value', snap => {
                const list = document.getElementById('activeChatList');
                list.innerHTML = '';
                snap.forEach(c => {
                    const u = c.val();
                    if(u.authUid !== currentUser.uid && (u.name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q))) {
                        list.innerHTML += `
                            <div onclick="openChat('${u.authUid}', '${u.name}', '${u.photo}')" class="p-3 bg-slate-900 border border-slate-800 rounded-2xl flex items-center justify-between cursor-pointer">
                                <div class="flex items-center space-x-3"><img src="${u.photo}" class="w-11 h-11 rounded-full object-cover"><div><h4 class="font-semibold text-sm text-white">${u.name}</h4><p class="text-[10px] text-pink-400">@${u.username}</p></div></div>
                            </div>`;
                    }
                });
            });
        }

        function openUserProfile(authUid, numericUid, name, username, photo) {
            modalTargetUser = authUid;
            document.getElementById('modalUserName').innerText = name;
            document.getElementById('modalUserUsername').innerText = '@' + username;
            document.getElementById('modalUserUid').innerText = 'ID: ' + numericUid;
            document.getElementById('modalUserPhoto').src = photo;
            document.getElementById('userProfileModal').classList.remove('hide');
            checkFollowStatus(authUid);
        }

        function closeUserProfileModal() { document.getElementById('userProfileModal').classList.add('hide'); }

        function checkFollowStatus(target) {
            db.ref(`follows/${currentUser.authUid}/${target}`).once('value', s => {
                document.getElementById('modalFollowBtn').innerText = s.exists() ? "Following" : "Follow";
            });
        }

        function toggleFollowModalUser() {
            const ref = db.ref(`follows/${currentUser.authUid}/${modalTargetUser}`);
            ref.once('value', s => {
                if(s.exists()) { ref.remove(); document.getElementById('modalFollowBtn').innerText = "Follow"; }
                else { ref.set(true); document.getElementById('modalFollowBtn').innerText = "Following"; }
                loadFollowStats();
            });
        }

        function loadFollowStats() {
            db.ref(`follows`).once('value', snap => {
                let followers = 0, following = 0;
                snap.forEach(userNode => {
                    if(userNode.key === currentUser.authUid) following = userNode.numChildren();
                    if(userNode.hasChild(currentUser.authUid)) followers++;
                });
                document.getElementById('statFollowers').innerText = followers;
                document.getElementById('statFollowing').innerText = following;
            });
        }

        function openFollowList(type) {
            const modal = document.getElementById('followListModal');
            const container = document.getElementById('followUsersContainer');
            container.innerHTML = '';
            document.getElementById('followModalTitle').innerText = type.toUpperCase();
            modal.classList.remove('hide');

            db.ref('follows').once('value', snap => {
                let ids = [];
                if(type === 'following') {
                    if(snap.child(currentUser.authUid).exists()) ids = Object.keys(snap.child(currentUser.authUid).val());
                } else {
                    snap.forEach(userNode => {
                        if(userNode.hasChild(currentUser.authUid)) ids.push(userNode.key);
                    });
                }
                ids.forEach(id => {
                    db.ref('users/' + id).once('value', uSnap => {
                        const u = uSnap.val();
                        if(u) {
                            container.innerHTML += `<div class="p-2 bg-slate-800 rounded-xl flex items-center space-x-2"><img src="${u.photo}" class="w-8 h-8 rounded-full"><span class="text-xs text-white">${u.name}</span></div>`;
                        }
                    });
                });
            });
        }

        // ROOMS LOGIC (Owner deletion, 24h auto-delete, Criteria & Media permission)
        function openCreateRoomModal() { document.getElementById('createRoomModal').classList.remove('hide'); }

        function submitCreateRoom() {
            const title = document.getElementById('roomTitleInput').value;
            const criteria = document.getElementById('roomCriteriaInput').value;
            const type = document.getElementById('roomTypeInput').value;
            if(!title) return alert('Enter room title');

            const ref = db.ref('rooms').push();
            activeRoomId = ref.key;
            ref.set({
                id: activeRoomId,
                title,
                criteria,
                type,
                creator: currentUser.authUid,
                creatorName: userData.name,
                timestamp: Date.now()
            });

            // Auto delete after 24 hours if not closed
            setTimeout(() => { ref.remove(); }, 24 * 3600 * 1000);

            document.getElementById('createRoomModal').classList.add('hide');
            openRoomView(title, criteria, type);
        }

        function joinRoom(id, title, criteria, type) {
            activeRoomId = id;
            openRoomView(title, criteria, type);
        }

        function openRoomView(title, criteria, type) {
            document.getElementById('viewRoomTitle').innerText = title;
            document.getElementById('viewRoomCriteria').innerText = "Criteria: " + (criteria || "General rules apply");
            document.getElementById('roomViewScreen').classList.remove('hide');

            if(type === 'video' || type === 'audio') {
                navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true }).then(stream => {
                    localStream = stream;
                    if(type === 'video') {
                        document.getElementById('roomVideoFeed').classList.remove('hide');
                        document.getElementById('localVideoElement').srcObject = stream;
                    }
                }).catch(err => alert('Microphone/Camera permission required for call rooms!'));
            }
        }

        function exitActiveRoom() {
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            db.ref('rooms/' + activeRoomId).once('value', snap => {
                const room = snap.val();
                if(room && room.creator === currentUser.authUid) {
                    db.ref('rooms/' + activeRoomId).remove(); // Delete only if owner exits
                }
            });
            document.getElementById('roomViewScreen').classList.add('hide');
            activeRoomId = null;
        }

        function toggleMicrophone() {
            if(localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                audioTrack.enabled = !audioTrack.enabled;
                alert(audioTrack.enabled ? "Microphone Unmuted" : "Microphone Muted");
            }
        }

        function toggleLoudspeaker() {
            alert("Loudspeaker toggled!");
        }

        function loadRooms() {
            db.ref('rooms').on('value', snap => {
                const list = document.getElementById('roomsList');
                const homeList = document.getElementById('homeRoomsList');
                if(list) list.innerHTML = '';
                if(homeList) homeList.innerHTML = '';
                snap.forEach(c => {
                    const r = c.val();
                    const html = `
                        <div class="p-3 bg-slate-900 border border-slate-800 rounded-2xl flex items-center justify-between">
                            <div><h4 class="font-semibold text-sm text-white">${r.title}</h4><p class="text-[10px] text-pink-400">Type: ${r.type.toUpperCase()} • Host: ${r.creatorName}</p></div>
                            <button onclick="joinRoom('${r.id}', '${r.title}', '${r.criteria}', '${r.type}')" class="bg-pink-600 px-3 py-1.5 rounded-lg text-xs font-semibold text-white">Join</button>
                        </div>`;
                    if(list) list.innerHTML += html;
                    if(homeList) homeList.innerHTML += html;
                });
            });
        }

        // CHAT & DIRECT CALLING (WhatsApp / Insta style)
        function openChat(authUid, name, photo) {
            currentChatUser = authUid;
            document.getElementById('activeChatName').innerText = name;
            document.getElementById('chatUserAvatar').innerHTML = `<img src="${photo}" class="w-full h-full rounded-full object-cover">`;
            document.getElementById('mainDashboard').classList.add('hide');
            document.getElementById('chatWindow').classList.remove('hide');
            loadMessages();
        }

        function closeChat() {
            currentChatUser = null;
            document.getElementById('chatWindow').classList.add('hide');
            document.getElementById('mainDashboard').classList.remove('hide');
        }

        function sendTextMessage() {
            const text = document.getElementById('messageInput').value;
            if(!text) return;
            const chatId = [currentUser.authUid, currentChatUser].sort().join('_');
            db.ref('chats/' + chatId).push({ sender: currentUser.authUid, text, timestamp: Date.now() });
            document.getElementById('messageInput').value = '';
        }

        function loadMessages() {
            const chatId = [currentUser.authUid, currentChatUser].sort().join('_');
            db.ref('chats/' + chatId).on('value', snap => {
                const container = document.getElementById('messageContainer');
                container.innerHTML = '';
                snap.forEach(c => {
                    const m = c.val();
                    const isMe = m.sender === currentUser.authUid;
                    container.innerHTML += `<div class="flex ${isMe ? 'justify-end' : 'justify-start'}"><div class="p-3 rounded-2xl text-xs max-w-xs ${isMe ? 'bg-pink-600 text-white' : 'bg-slate-900 text-slate-200 border border-slate-800'}">${m.text}</div></div>`;
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function startDirectCall(type) {
            navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true }).then(() => {
                db.ref('calls/' + currentChatUser).set({ caller: currentUser.authUid, callerName: userData.name, type, status: 'ringing', timestamp: Date.now() });
                alert(`Starting direct ${type} call... Permission verified!`);
            }).catch(() => alert('Microphone/Camera permission required to initiate call.'));
        }

        function logoutApp() {
            auth.signOut().then(() => { localStorage.clear(); location.reload(); });
        }
    </script>
</body>
</html>
