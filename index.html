<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Auto-Healing Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; }
        label { display: block; margin-top: 10px; font-size: 14px; }
        input { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; margin-top: 20px; background: #38bdf8; color: #0f172a; border: none; padding: 12px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0ea5e9; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>APK Admin Panel</h2>
    <form id="gameForm">
        <label>Game ID (Jaise: free_fire_mod):</label>
        <input type="text" id="game_id" required placeholder="free_fire_2018">

        <label>Source Page URL (Jahan se link scrape hogi):</label>
        <input type="url" id="source_url" required placeholder="https://example.com/game-download">

        <label>Current Download Link (Abhi wali link):</label>
        <input type="url" id="download_link" required placeholder="https://example.com/download.apk">

        <label>Blogger Post ID (Blogger post ka ID):</label>
        <input type="text" id="blogger_post_id" required placeholder="2982238408328855288">

        <button type="button" onclick="saveData()">Firebase mein Save Karein</button>
    </form>
    <div id="status"></div>
</div>

<script>
    async function saveData() {
        const gameId = document.getElementById('game_id').value.trim();
        const sourceUrl = document.getElementById('source_url').value.trim();
        const downloadLink = document.getElementById('download_link').value.trim();
        const bloggerPostId = document.getElementById('blogger_post_id').value.trim();
        const statusDiv = document.getElementById('status');

        if(!gameId || !sourceUrl || !downloadLink || !bloggerPostId) {
            statusDiv.style.color = '#f87171';
            statusDiv.innerText = "Bhai, saare fields bharna zaroori hain!";
            return;
        }

        const data = {
            source_url: sourceUrl,
            download_link: downloadLink,
            blogger_post_id: bloggerPostId
        };

        try {
            statusDiv.style.color = '#facc15';
            statusDiv.innerText = "Saving to Firebase...";

            const response = await fetch(`https://vibe-chat-ee27e-default-rtdb.firebaseio.com/games/${gameId}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if(response.ok) {
                statusDiv.style.color = '#4ade80';
                statusDiv.innerText = "Successfully Saved! 🎉";
                document.getElementById('gameForm').reset();
            } else {
                throw new Error("Failed to save");
            }
        } catch (error) {
            statusDiv.style.color = '#f87171';
            statusDiv.innerText = "Error: " + error.message;
        }
    }
</script>

</body>
</html>
