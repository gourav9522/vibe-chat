<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeChat Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000000; color: #f8fafc; overflow: hidden; }
        
        .vibe-bg-glow {
            position: absolute; inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(236, 72, 153, 0.3), transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.25), transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(244, 63, 94, 0.2), transparent 50%);
            pointer-events: none; z-index: 0;
        }

        @keyframes floatHeartAnim {
            0% { transform: translateY(0px) scale(0.6) rotate(0deg); opacity: 0.2; }
            50% { transform: translateY(-40px) scale(1.3) rotate(15deg); opacity: 0.8; }
            100% { transform: translateY(0px) scale(0.6) rotate(0deg); opacity: 0.2; }
        }
        .floating-heart-bg {
            position: absolute;
            animation: floatHeartAnim 5s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .hide { display: none !important; }
        ::-webkit-scrollbar { height: 4px; width: 4px; }
        ::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden relative">

    <!-- GLOW & BACKGROUND LOVER HEARTS ANIMATION -->
    <div class="vibe-bg-glow"></div>
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="floating-heart-bg text-3xl" style="top: 15%; left: 10%; animation-delay: 0s;">💖</div>
        <div class="floating-heart-bg text-4xl" style="top: 35%; left: 80%; animation-delay: 1.2s;">❤️‍🔥</div>
        <div class="floating-heart-bg text-2xl" style="top: 65%; left: 20%; animation-delay: 2.5s;">💘</div>
        <div class="floating-heart-bg text-3xl" style="top: 80%; left: 75%; animation-delay: 0.8s;">💓</div>
        <div class="floating-heart-bg text-5xl" style="top: 50%; left: 45%; animation-delay: 3.1s;">💗</div>
        <div class="floating-heart-bg text-2xl" style="top: 25%; left: 40%; animation-delay: 1.8s;">💕</div>
    </div>

    <!-- INSTAGRAM STYLE TOP POPUP NOTIFICATION -->
    <div id="topNotificationPopup" class="fixed top-4 left-4 right-4 bg-slate-900/95 border border-pink-500/50 p-3 rounded-2xl shadow-2xl z-50 hide flex items-center space-x-3 backdrop-blur-md transition-all duration-300">
        <img id="notifUserPhoto" src="" class="w-10 h-10 rounded-full object-cover border border-pink-500">
        <div class="flex-1 min-w-0">
            <h4 id="notifUserName" class="font-bold text-xs text-white truncate"></h4>
            <p id="notifUserText" class="text-[11px] text-slate-300 truncate"></p>
        </div>
        <button onclick="openChatFromNotification()" class="bg-pink-600 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">Reply</button>
    </div>

    <!-- 1. LOGIN SCREEN -->
    <div id="loginScreen" class="flex flex-col items-center justify-center h-full p-6 text-center overflow-y-auto z-10">
        <img src="https://archive.org/download/vibe_20260921/image_f8fcaf71~3.jpg" class="w-20 h-20 rounded-3xl shadow-lg mb-4 object-cover shadow-pink-500/30" alt="Logo">
        <h1 class="text-3xl font-bold mb-2 bg-gradient-to-r from-pink-400 to-indigo-400 bg-clip-text text-transparent">VibeChat Pro</h1>
        <p class="text-slate-400 mb-6 text-sm">Instant social & live connections.</p>
        <div class="w-full max-w-sm space-y-4">
            <button onclick="loginWithGoogle()" class="w-full bg-white text-slate-900 font-semibold py-3.5 px-6 rounded-xl flex items-center justify-center space-x-3 shadow-md active:scale-95 transition-transform">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                <span>Continue with Google</span>
            </button>
        </div>
    </div>

    <!-- 2. PROFILE SETUP SCREEN -->
    <div id="profileScreen" class="flex flex-col items-center justify-center h-full p-6 text-center hide overflow-y-auto z-10">
        <h2 class="text-2xl font-bold mb-2">Setup Your Profile</h2>
        <div class="w-full max-w-sm space-y-4 text-left">
            <div>
                <label class="text-xs text-slate-400 mb-1 block">Profile Photo</label>
                <input type="file" id="setupPhotoFile" accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-sm text-slate-300">
            </div>
            <div>
                <label class="text-xs text-slate-400 mb-1 block">Name</label>
                <input type="text" id="setupName" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500">
            </div>
            <div>
                <label class="text-xs text-slate-400 mb-1 block">Unique Username</label>
                <input type="text" id="setupUsername" placeholder="e.g. vibe_master" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500">
            </div>
            <div>
                <label class="text-xs text-slate-400 mb-1 block">Gender</label>
                <select id="setupGender" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>

            </div>
            <button onclick="saveProfileData()" class="w-full bg-gradient-to-r from-pink-600 to-indigo-600 font-semibold py-3.5 rounded-xl text-white shadow-lg">Save & Continue</button>
        </div>
    </div>

    <!-- 3. MAIN DASHBOARD -->

                <button onclick="toggleSidebar(true)" id="headerProfileBtn" class="w-9 h-9 rounded-full bg-pink-600 overflow-hidden flex items-center justify-center font-bold border border-pink-400 shadow-md">P</button>
                <h1 class="text-xl font-bold bg-gradient-to-r from-pink-400 to-indigo-400 bg-clip-text text-transparent">VibeChat</h1>
            </div>
        </header>

        <!-- TABS CONTAINER -->
        <div class="flex-1 overflow-hidden relative">
            <!-- HOME TAB -->
            <div id="homeTabContent" class="absolute inset-0 overflow-y-auto p-4 space-y-4">
                <div>
                    <h3 class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">Online & Offline Users 🔥</h3>
                    <div id="horizontalOnlineList" class="flex space-x-3 overflow-x-auto pb-2 scroll-smooth" dir="rtl"></div>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Live Rooms 🎤</h3>
                    <div id="homeRoomsList" class="space-y-2"></div>
                </div>
            </div>

            <!-- SEARCH TAB (Username & ID Search) -->
            <div id="searchTabContent" class="absolute inset-0 overflow-y-auto p-4 space-y-3 hide">
                <div class="relative">
                    <input type="text" id="globalSearchInput" oninput="searchAllUsers()" placeholder="Search by Username or Unique ID..." class="w-full bg-slate-900 border-2 border-emerald-500 rounded-xl px-4 py-3 text-sm text-white placeholder-emerald-300/60 shadow-[0_0_15px_rgba(16,185,129,0.3)] focus:outline-none focus:border-amber-400">
                    <span class="absolute right-4 top-3.5 text-amber-400 font-bold">🔍</span>
                </div>
                <div id="globalSearchResultContainer" class="space-y-2"></div>
            </div>

            <!-- CHATS TAB -->
            <div id="chatsTabContent" class="absolute inset-0 overflow-y-auto p-4 space-y-3 hide">
                <div id="activeChatList" class="space-y-2"></div>
            </div>

            <!-- ROOMS TAB -->
            <div id="roomsTabContent" class="absolute inset-0 overflow-y-auto p-4 space-y-3 hide">
                <button onclick="openCreateRoomModal()" class="w-full bg-gradient-to-r from-pink-600 to-indigo-600 text-white font-semibold py-3 rounded-xl shadow-md">+ Create Room</button>
                <div id="roomsList" class="space-y-3"></div>
            </div>
        </div>

        <!-- INSTAGRAM STYLE BOTTOM NAVIGATION BAR -->
        <footer class="p-3 bg-black/90 border-t border-slate-800 flex justify-around items-center">
            <button onclick="switchTab('home')" id="tabHomeBtn" class="flex flex-col items-center text-pink-500">
                <span class="text-xl">🏠</span>
                <span class="text-[10px] font-semibold">Home</span>
            </button>
            <button onclick="switchTab('search')" id="tabSearchBtn" class="flex flex-col items-center text-slate-400">
                <span class="text-xl">🔍</span>
                <span class="text-[10px] font-semibold">Search</span>
            </button>
            <button onclick="switchTab('chats')" id="tabChatsBtn" class="flex flex-col items-center text-slate-400">
                <span class="text-xl">💬</span>
                <span class="text-[10px] font-semibold">Chats</span>
            </button>
            <button onclick="switchTab('rooms')" id="tabRoomsBtn" class="flex flex-col items-center text-slate-400">
                <span class="text-xl">🎙️</span>
                <span class="text-[10px] font-semibold">Rooms</span>
            </button>
        </footer>
    </div>

    <!-- CREATE ROOM MODAL -->
    <div id="createRoomModal" class="fixed inset-0 bg-black/90 z-50 hide flex items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
            <div class="flex justify-between items-center"><h3 class="font-bold text-md text-pink-400">Create New Room</h3><button onclick="document.getElementById('createRoomModal').classList.add('hide')" class="text-slate-400 font-bold">&times;</button></div>
            <input type="text" id="roomTitleInput" placeholder="Room Title (e.g. Music Lovers)" class="w-full bg-black p-3 rounded-xl text-xs text-white border border-slate-800">
            <textarea id="roomCriteriaInput" placeholder="Room Criteria / Rules" class="w-full bg-black p-3 rounded-xl text-xs text-white h-20 border border-slate-800"></textarea>
            <select id="roomTypeInput" class="w-full bg-black p-3 rounded-xl text-xs text-white border border-slate-800">
                <option value="audio">Audio Call Room</option>
                <option value="video">Video Call Room</option>
                <option value="chat">Normal Chat Room</option>
            </select>
            <button onclick="submitCreateRoom()" class="w-full bg-pink-600 py-3 rounded-xl font-semibold text-xs text-white shadow-md">Launch Room</button>
        </div>
    </div>

    <!-- ROOM VIEW SCREEN -->
    <div id="roomViewScreen" class="fixed inset-0 bg-black z-50 hide flex flex-col justify-between p-4">
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
            <div>
                <h2 id="viewRoomTitle" class="font-bold text-sm text-white"></h2>
                <p id="viewRoomCriteria" class="text-[10px] text-pink-400 mt-1"></p>
            </div>
            <button onclick="exitActiveRoom()" class="bg-rose-600 px-3 py-1.5 rounded-xl text-xs font-semibold text-white">Exit Room</button>
        </div>
        <div id="roomMediaContainer" class="flex-1 flex flex-col items-center justify-center space-y-4">
            <div id="roomVideoFeed" class="w-full max-w-xs h-64 bg-slate-900 rounded-3xl border border-slate-800 flex items-center justify-center overflow-hidden relative hide">
                <video id="localVideoElement" autoplay playsinline muted class="w-full h-full object-cover"></video>
            </div>
            <p id="roomStatusText" class="text-xs text-emerald-400 animate-pulse">Connected to live stream...</p>
        </div>
        <div class="p-3 bg-slate-900 rounded-2xl flex justify-center space-x-4">
            <button onclick="toggleMicrophone()" class="bg-slate-800 p-3 rounded-full text-white text-sm">🎙️ Mic</button>
            <button onclick="toggleLoudspeaker()" class="bg-slate-800 p-3 rounded-full text-white text-sm">🔊 Speaker</button>
        </div>
    </div>

    <!-- SIDEBAR DRAWER -->
    <div id="sidebarDrawer" class="fixed inset-0 bg-black/80 z-50 hide flex">
        <div class="w-80 bg-slate-900 h-full p-5 flex flex-col justify-between border-r border-slate-800 overflow-y-auto">
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-lg text-pink-400">My Profile</h2>
                    <button onclick="toggleSidebar(false)" class="text-slate-400 text-xl font-bold">&times;</button>
                </div>
                <div class="flex flex-col items-center text-center space-y-2">
                    <div class="relative">
                        <img id="sidebarPhoto" src="" class="w-20 h-20 rounded-full object-cover border-2 border-pink-500 shadow-md">
                    </div>
                    <h3 id="sidebarName" class="font-semibold text-md text-white"></h3>
                    <p id="sidebarUsername" class="text-xs text-pink-400 font-medium"></p>
                    <p id="sidebarGender" class="text-[10px] text-slate-300"></p>
                    <p id="sidebarUid" class="text-[10px] text-slate-400 font-mono bg-black px-2 py-0.5 rounded"></p>
                </div>
                <div class="flex justify-around py-3 bg-black/50 rounded-2xl border border-slate-800">
                    <div onclick="openFollowListModal('followers')" class="cursor-pointer text-center">
                        <span id="sidebarFollowersCount" class="block font-bold text-sm text-white">0</span>
                        <span class="text-[10px] text-slate-400">Followers</span>
                    </div>
                    <div class="w-[1px] bg-slate-800"></div>
                    <div onclick="openFollowListModal('following')" class="cursor-pointer text-center">
                        <span id="sidebarFollowingCount" class="block font-bold text-sm text-white">0</span>
                        <span class="text-[10px] text-slate-400">Following</span>
                    </div>
                </div>
            </div>
            <button onclick="logoutApp()" class="w-full bg-rose-600 hover:bg-rose-500 py-2.5 rounded-xl text-xs font-semibold mt-4">Logout</button>
        </div>
        <div class="flex-1" onclick="toggleSidebar(false)"></div>
    </div>

    <!-- USER PROFILE VIEW MODAL -->
    <div id="userProfileModal" class="fixed inset-0 bg-black/90 z-50 hide flex items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-3xl w-full max-w-xs text-center space-y-4 relative shadow-2xl">
            <button onclick="closeUserProfileModal()" class="absolute top-3 right-4 text-slate-400 text-xl font-bold">&times;</button>
            <img id="modalUserPhoto" src="" class="w-24 h-24 rounded-full object-cover mx-auto border-2 border-pink-500 shadow-lg">
            <div>
                <h3 id="modalUserName" class="text-lg font-bold text-white"></h3>
                <p id="modalUserUsername" class="text-xs text-pink-400 font-medium"></p>
                <p id="modalUserGender" class="text-[11px] text-slate-300 mt-0.5"></p>
                <p id="modalUserUid" class="text-[10px] text-slate-400 font-mono mt-1"></p>
            </div>
            <div class="flex justify-around py-2 bg-black/40 rounded-xl border border-slate-800 text-xs">
                <span id="modalFollowersCount" class="text-slate-300"><b>0</b> Followers</span>
                <span id="modalFollowingCount" class="text-slate-300"><b>0</b> Following</span>
            </div>
            <div class="flex space-x-2 pt-2">
                <button id="modalFollowBtn" onclick="toggleFollowModalUser()" class="flex-1 bg-pink-600 py-2.5 rounded-xl font-semibold text-xs text-white">Follow</button>
                <button onclick="messageModalUser()" class="flex-1 bg-indigo-600 py-2.5 rounded-xl font-semibold text-xs text-white">Message</button>
            </div>
        </div>
    </div>

    <!-- FOLLOWERS / FOLLOWING LIST MODAL -->
    <div id="followListModal" class="fixed inset-0 bg-black/90 z-50 hide flex items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-700 p-5 rounded-3xl w-full max-w-xs flex flex-col h-96 space-y-3 relative shadow-2xl">
            <div class="flex justify-between items-center"><h3 id="followListTitle" class="font-bold text-sm text-pink-400">List</h3><button onclick="document.getElementById('followListModal').classList.add('hide')" class="text-slate-400 font-bold text-lg">&times;</button></div>
            <div id="followListContainer" class="flex-1 overflow-y-auto space-y-2"></div>
        </div>
    </div>

    <!-- 4. CHAT WINDOW WITH MEDIA SHARING -->
    <div id="chatWindow" class="fixed inset-0 bg-black z-50 hide flex flex-col justify-between">
        <div class="p-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button onclick="closeChat()" class="text-slate-400 hover:text-white font-bold text-lg">&larr;</button>
                <div class="flex items-center space-x-2">
                    <div id="chatUserAvatar" class="w-8 h-8 rounded-full bg-pink-600 flex items-center justify-center text-xs font-bold overflow-hidden">U</div>
                    <div>
                        <h3 id="activeChatName" class="font-semibold text-xs text-white">User Name</h3>
                        <span id="activeChatStatus" class="text-[10px] text-emerald-400">Online</span>
                    </div>
                </div>
            </div>
        </div>
        <div id="messageContainer" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        
        <div class="p-3 bg-slate-900 border-t border-slate-800 flex items-center space-x-2">
            <label class="cursor-pointer text-pink-400 text-lg px-1">
                📎 <input type="file" id="mediaUploadInput" accept="image/*,video/*" class="hide" onchange="sendMediaMessage(this)">
            </label>
            <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 bg-black border border-slate-700 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-pink-500">
            <button onclick="sendTextMessage()" class="bg-pink-600 px-4 py-2 rounded-xl font-semibold text-xs text-white shadow-md">Send</button>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDj-2kVhmOOsYxKp9ChB2ATmJMiQvPysrA",
            authDomain: "vibe-chat-ee27e.firebaseapp.com",
            projectId: "vibe-chat-ee27e",
            storageBucket: "vibe-chat-ee27e.firebasestorage.app",
            messagingSenderId: "891909676621",
            appId: "1:891909676621:web:97cd033dac7cfb10fb4604",
            measurementId: "G-304XJYYHEG"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const storage = firebase.storage();

        let currentUser = null;
        let userData = null;
        let currentChatUser = null;
        let modalTargetUser = null;
        let activeRoomId = null;
        let localStream = null;
        let notifTimeout = null;

        function generateNumericUid() { return Math.floor(1000000 + Math.random() * 9000000).toString(); }

        // Local Storage Caching check to prevent blank screen on slow net / offline
        const cachedUser = localStorage.getItem('vibe_local_user');
        if(cachedUser) {
            userData = JSON.parse(cachedUser);
            document.getElementById('loginScreen').classList.add('hide');
            initDashboard();
        }

        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
            auth.onAuthStateChanged(user => {
                if(user) {
                    currentUser = user;
                    fetchUserData(user.uid);
                } else if(!cachedUser) {
                    document.getElementById('loginScreen').classList.remove('hide');
                }
            });
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithRedirect(provider).catch(err => alert("Login Error: " + err.message));
        }

        auth.getRedirectResult().then((res) => {
            if(res.user) {
                currentUser = res.user;
                fetchUserData(currentUser.uid);
            }
        });

        function fetchUserData(uid) {
            db.ref('users/' + uid).once('value', snapshot => {
                if(snapshot.exists()) {
                    userData = snapshot.val();
                    localStorage.setItem('vibe_local_user', JSON.stringify(userData));
                    initDashboard();
                } else {
                    document.getElementById('loginScreen').classList.add('hide');
                    document.getElementById('profileScreen').classList.remove('hide');
                }
            });
        }

        function saveProfileData() {
            const name = document.getElementById('setupName').value;
            const username = document.getElementById('setupUsername').value.toLowerCase().trim();
            const gender = document.getElementById('setupGender').value;
            const file = document.getElementById('setupPhotoFile').files[0];
            if(!name || !username) return alert('Fill required fields');
            
            db.ref('users').orderByChild('username').equalTo(username).once('value', snap => {
                if(snap.exists()) {
                    alert('Username already taken! Choose another.');
                    return;
                }
                const numericUid = generateNumericUid();
                const proceed = (photoUrl) => {
                    userData = { uid: numericUid, authUid: currentUser.uid, name, username, gender, photo: photoUrl || '', status: 'Online' };
                    db.ref('users/' + currentUser.uid).set(userData, () => {
                        localStorage.setItem('vibe_local_user', JSON.stringify(userData));
                        initDashboard();
                    });
                };

                if(file) {
                    storage.ref('profiles/' + currentUser.uid).put(file).then(s => s.ref.getDownloadURL().then(proceed)).catch(() => proceed('https://archive.org/download/vibe_20260921/image_f8fcaf71~3.jpg'));
                } else proceed('https://archive.org/download/vibe_20260921/image_f8fcaf71~3.jpg');
            });
        }

        function initDashboard() {
            document.getElementById('loginScreen').classList.add('hide');
            document.getElementById('profileScreen').classList.add('hide');
            document.getElementById('mainDashboard').classList.remove('hide');
            document.getElementById('sidebarPhoto').src = userData.photo || 'https://archive.org/download/vibe_20260921/image_f8fcaf71~3.jpg';
            document.getElementById('sidebarName').innerText = userData.name;
            document.getElementById('sidebarUsername').innerText = '@' + userData.username;
            document.getElementById('sidebarGender').innerText = 'Gender: ' + (userData.gender || 'Not specified');
            document.getElementById('sidebarUid').innerText = 'ID: ' + userData.uid;
            document.getElementById('headerProfileBtn').innerHTML = `<img src="${userData.photo}" class="w-full h-full object-cover">`;

            loadFollowCounts(currentUser.authUid, 'sidebarFollowersCount', 'sidebarFollowingCount');
            loadAllUsersOnHome();
            loadRooms();
            listenToIncomingMessagesGlobally();
        }

        function toggleSidebar(show) {
            document.getElementById('sidebarDrawer').classList[show ? 'remove' : 'add']('hide');
        }

        function switchTab(tab) {
            ['home', 'search', 'chats', 'rooms'].forEach(t => {
                document.getElementById(t + 'TabContent').classList.add('hide');
                document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1) + 'Btn').className = "flex flex-col items-center text-slate-400";
            });
            document.getElementById(tab + 'TabContent').classList.remove('hide');
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1) + 'Btn').className = "flex flex-col items-center text-pink-500";
            if(tab === 'chats') loadChatsList();
        }

        function loadAllUsersOnHome() {
            db.ref('users').on('value', snap => {
                const list = document.getElementById('horizontalOnlineList');
                if(!list) return;
                list.innerHTML = '';
                snap.forEach(c => {
                    const u = c.val();
                    if(u.authUid !== currentUser.authUid) {
                        list.innerHTML += `
                            <div onclick="openUserProfile('${u.authUid}', '${u.uid}', '${u.name}', '${u.username}', '${u.gender}', '${u.photo}')" class="flex-shrink-0 flex flex-col items-center cursor-pointer space-y-1 w-16 relative">
                                <div class="relative">
                                    <img src="${u.photo}" class="w-14 h-14 rounded-full object-cover border-2 border-pink-500">
                                    <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-black rounded-full"></span>
                                </div>
                                <span class="text-[10px] text-slate-300 truncate w-full text-center">${u.name}</span>
                            </div>`;
                    }
                });
            });
        }

        function searchAllUsers() {
            const query = document.getElementById('globalSearchInput').value.toLowerCase().trim();
            const container = document.getElementById('globalSearchResultContainer');
            container.innerHTML = '';
            if(!query) return;

            db.ref('users').once('value', snap => {
                snap.forEach(c => {
                    const u = c.val();
                    if(u.authUid !== currentUser.authUid && (u.username.toLowerCase().includes(query) || u.uid.toLowerCase().includes(query) || u.name.toLowerCase().includes(query))) {
                        container.innerHTML += `
                            <div onclick="openUserProfile('${u.authUid}', '${u.uid}', '${u.name}', '${u.username}', '${u.gender}', '${u.photo}')" class="p-3 bg-slate-900 border border-emerald-500/50 rounded-2xl flex items-center justify-between cursor-pointer">
                                <div class="flex items-center space-x-3">
                                    <img src="${u.photo}" class="w-11 h-11 rounded-full object-cover border border-pink-500">
                                    <div>
                                        <h4 class="font-semibold text-sm text-white">${u.name}</h4>
                                        <p class="text-[10px] text-pink-400">@${u.username} • ID: ${u.uid}</p>
                                    </div>
                                </div>
                                <span class="text-xs text-emerald-400 font-bold bg-emerald-950 px-2.5 py-1 rounded-lg">View</span>
                            </div>`;
                    }
                });
            });
        }

        function openUserProfile(authUid, numericUid, name, username, gender, photo) {
            modalTargetUser = authUid;
            document.getElementById('modalUserName').innerText = name;
            document.getElementById('modalUserUsername').innerText = '@' + username;
            document.getElementById('modalUserGender').innerText = 'Gender: ' + (gender || 'Not specified');
            document.getElementById('modalUserUid').innerText = 'ID: ' + numericUid;
            document.getElementById('modalUserPhoto').src = photo;
            document.getElementById('userProfileModal').classList.remove('hide');

            loadFollowCounts(authUid, 'modalFollowersCount', 'modalFollowingCount', true);
            checkIfFollowing(authUid);
        }

        function closeUserProfileModal() { document.getElementById('userProfileModal').classList.add('hide'); }

        function loadFollowCounts(targetAuthUid, followersElId, followingElId, formatText = false) {
            db.ref('follows/' + targetAuthUid + '/followers').on('value', s => {
                const count = s.numChildren();
                const el = document.getElementById(followersElId);
                if(el) el.innerHTML = formatText ? `<b>${count}</b> Followers` : count;
            });
            db.ref('follows/' + targetAuthUid + '/following').on('value', s => {
                const count = s.numChildren();
                const el = document.getElementById(followingElId);
                if(el) el.innerHTML = formatText ? `<b>${count}</b> Following` : count;
            });
        }

        function checkIfFollowing(targetAuthUid) {
            db.ref('follows/' + targetAuthUid + '/followers/' + currentUser.authUid).once('value', s => {
                const btn = document.getElementById('modalFollowBtn');
                if(s.exists()) {
                    btn.innerText = "Following";
                    btn.className = "flex-1 bg-slate-800 border border-slate-700 py-2.5 rounded-xl font-semibold text-xs text-slate-300";
                } else {
                    btn.innerText = "Follow";
                    btn.className = "flex-1 bg-pink-600 py-2.5 rounded-xl font-semibold text-xs text-white";
                }
            });
        }

        function toggleFollowModalUser() {
            const refFollowers = db.ref('follows/' + modalTargetUser + '/followers/' + currentUser.authUid);
            const refFollowing = db.ref('follows/' + currentUser.authUid + '/following/' + modalTargetUser);

            refFollowers.once('value', s => {
                if(s.exists()) {
                    refFollowers.remove();
                    refFollowing.remove();
                    document.getElementById('modalFollowBtn').innerText = "Follow";
                    document.getElementById('modalFollowBtn').className = "flex-1 bg-pink-600 py-2.5 rounded-xl font-semibold text-xs text-white";
                } else {
                    refFollowers.set(true);
                    refFollowing.set(true);
                    document.getElementById('modalFollowBtn').innerText = "Following";
                    document.getElementById('modalFollowBtn').className = "flex-1 bg-slate-800 border border-slate-700 py-2.5 rounded-xl font-semibold text-xs text-slate-300";
                }
            });
        }

        function openFollowListModal(type) {
            const modal = document.getElementById('followListModal');
            const titleEl = document.getElementById('followListTitle');
            const container = document.getElementById('followListContainer');
            modal.classList.remove('hide');
            titleEl.innerText = type.charAt(0).toUpperCase() + type.slice(1) + " List";
            container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Loading...</p>';

            db.ref('follows/' + modalTargetUser + '/' + type).once('value', snap => {
                container.innerHTML = '';
                if(!snap.exists()) {
                    container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">No users found.</p>';
                    return;
                }
                snap.forEach(c => {
                    const targetUid = c.key;
                    db.ref('users/' + targetUid).once('value', uSnap => {
                        const u = uSnap.val();
                        if(u) {
                            container.innerHTML += `
                                <div onclick="document.getElementById('followListModal').classList.add('hide'); openUserProfile('${u.authUid}', '${u.uid}', '${u.name}', '${u.username}', '${u.gender}', '${u.photo}')" class="p-2.5 bg-black rounded-xl border border-slate-800 flex items-center justify-between cursor-pointer">
                                    <div class="flex items-center space-x-2">
                                        <img src="${u.photo}" class="w-8 h-8 rounded-full object-cover border border-pink-500">
                                        <span class="text-xs font-semibold text-white">${u.name}</span>
                                    </div>
                                    <span class="text-[10px] text-pink-400">@${u.username}</span>
                                </div>`;
                        }
                    });
                });
            });
        }

        function messageModalUser() {
            closeUserProfileModal();
            db.ref('users/' + modalTargetUser).once('value', s => {
                const u = s.val();
                if(u) openChat(u.authUid, u.name, u.photo);
            });
        }

        function openChat(authUid, name, photo) {
            currentChatUser = authUid;
            document.getElementById('activeChatName').innerText = name;
            document.getElementById('chatUserAvatar').innerHTML = `<img src="${photo}" class="w-full h-full rounded-full object-cover">`;
            document.getElementById('chatWindow').classList.remove('hide');
            loadMessages();
        }

        function closeChat() {
            currentChatUser = null;
            document.getElementById('chatWindow').classList.add('hide');
        }

        function sendTextMessage() {
            const text = document.getElementById('messageInput').value.trim();
            if(!text || !currentChatUser) return;
            const chatId = [currentUser.authUid, currentChatUser].sort().join('_');
            db.ref('chats/' + chatId).push({ sender: currentUser.authUid, text, type: 'text', timestamp: Date.now() });
            document.getElementById('messageInput').value = '';
        }

        function sendMediaMessage(input) {
            const file = input.files[0];
            if(!file || !currentChatUser) return;
            const isVideo = file.type.startsWith('video');
            const storageRef = storage.ref('chats/' + Date.now() + '_' + file.name);
            
            storageRef.put(file).then(snapshot => {
                snapshot.ref.getDownloadURL().then(url => {
                    const chatId = [currentUser.authUid, currentChatUser].sort().join('_');
                    db.ref('chats/' + chatId).push({ sender: currentUser.authUid, text: url, type: isVideo ? 'video' : 'image', timestamp: Date.now() });
                });
            });
        }

        function loadMessages() {
            if(!currentChatUser) return;
            const chatId = [currentUser.authUid, currentChatUser].sort().join('_');
            db.ref('chats/' + chatId).on('value', snap => {
                const container = document.getElementById('messageContainer');
                if(!container) return;
                container.innerHTML = '';
                snap.forEach(c => {
                    const m = c.val();
                    const isMe = m.sender === currentUser.authUid;
                    let content = `<span class="text-xs">${m.text}</span>`;
                    if(m.type === 'image') {
                        content = `<img src="${m.text}" class="w-48 rounded-xl object-cover mb-1"><a href="${m.text}" target="_blank" download class="block text-[10px] text-pink-300 underline text-right">Save to Gallery</a>`;
                    } else if(m.type === 'video') {
                        content = `<video src="${m.text}" controls class="w-48 rounded-xl mb-1"></video><a href="${m.text}" target="_blank" download class="block text-[10px] text-pink-300 underline text-right">Save to Gallery</a>`;
                    }
                    container.innerHTML += `<div class="flex ${isMe ? 'justify-end' : 'justify-start'}"><div class="p-3 rounded-2xl max-w-xs ${isMe ? 'bg-pink-600 text-white' : 'bg-slate-900 text-slate-200 border border-slate-800'}">${content}</div></div>`;
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function loadChatsList() {
            const listEl = document.getElementById('activeChatList');
            if(!listEl) return;
            listEl.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Loading chats...</p>';
            db.ref('users').once('value', snap => {
                listEl.innerHTML = '';
                snap.forEach(c => {
                    const u = c.val();
                    if(u.authUid !== currentUser.authUid) {
                        listEl.innerHTML += `
                            <div onclick="openChat('${u.authUid}', '${u.name}', '${u.photo}')" class="p-3 bg-slate-900 border border-slate-800 rounded-2xl flex items-center justify-between cursor-pointer">
                                <div class="flex items-center space-x-3">
                                    <img src="${u.photo}" class="w-10 h-10 rounded-full object-cover border border-pink-500">
                                    <div>
                                        <h4 class="font-semibold text-sm text-white">${u.name}</h4>
                                        <p class="text-[10px] text-slate-400">Tap to chat</p>
                                    </div>
                                </div>
                                <span class="text-xs text-pink-400 font-bold">Chat &rarr;</span>
                            </div>`;
                    }
                });
            });
        }

        function listenToIncomingMessagesGlobally() {
            db.ref('chats').on('child_added', snap => {
                const chatId = snap.key;
                if(chatId.includes(currentUser.authUid)) {
                    db.ref('chats/' + chatId).limitToLast(1).on('child_added', msgSnap => {
                        const m = msgSnap.val();
                        if(m && m.sender !== currentUser.authUid && (Date.now() - m.timestamp < 5000)) {
                            db.ref('users/' + m.sender).once('value', uSnap => {
                                const senderUser = uSnap.val();
                                if(senderUser) {
                                    showInstagramPopup(senderUser.authUid, senderUser.name, senderUser.photo, m.type === 'image' ? 'Sent a photo' : m.type === 'video' ? 'Sent a video' : m.text);
                                }
                            });
                        }
                    });
                }
            });
        }

        function showInstagramPopup(authUid, name, photo, text) {
            currentChatUser = authUid;
            document.getElementById('notifUserPhoto').src = photo;
            document.getElementById('notifUserName').innerText = name;
            document.getElementById('notifUserText').innerText = text;
            const popup = document.getElementById('topNotificationPopup');
            popup.classList.remove('hide');
            if(notifTimeout) clearTimeout(notifTimeout);
            notifTimeout = setTimeout(() => { popup.classList.add('hide'); }, 3000);
        }

        function openChatFromNotification() {
            document.getElementById('topNotificationPopup').classList.add('hide');
            db.ref('users/' + currentChatUser).once('value', s => {
                const u = s.val();
                if(u) openChat(u.authUid, u.name, u.photo);
            });
        }

        function openCreateRoomModal() { document.getElementById('createRoomModal').classList.remove('hide'); }

        function submitCreateRoom() {
            const title = document.getElementById('roomTitleInput').value.trim();
            const criteria = document.getElementById('roomCriteriaInput').value.trim();
            const type = document.getElementById('roomTypeInput').value;
            if(!title) return alert('Enter room title');

            const ref = db.ref('rooms').push();
            activeRoomId = ref.key;
            ref.set({ id: activeRoomId, title, criteria, type, creator: currentUser.authUid, creatorName: userData.name, timestamp: Date.now() }).then(() => {
                document.getElementById('createRoomModal').classList.add('hide');
                openRoomView(title, criteria, type);
            }).catch(err => alert("Room creation error: " + err.message));
        }

        function joinRoom(id, title, criteria, type) {
            activeRoomId = id;
            openRoomView(title, criteria, type);
        }

        function openRoomView(title, criteria, type) {
            document.getElementById('viewRoomTitle').innerText = title;
            document.getElementById('viewRoomCriteria').innerText = "Criteria: " + (criteria || "General rules");
            document.getElementById('roomViewScreen').classList.remove('hide');

            if(type === 'video' || type === 'audio') {
                navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true }).then(stream => {
                    localStream = stream;
                    if(type === 'video') {
                        document.getElementById('roomVideoFeed').classList.remove('hide');
                        document.getElementById('localVideoElement').srcObject = stream;
                    }
                }).catch(() => {
                    alert('Camera & Microphone permission required for live rooms!');
                });
            }
        }

        function exitActiveRoom() {
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById('roomViewScreen').classList.add('hide');
            activeRoomId = null;
        }

        function loadRooms() {
            db.ref('rooms').on('value', snap => {
                const homeList = document.getElementById('homeRoomsList');
                const roomsTabList = document.getElementById('roomsList');
                if(homeList) homeList.innerHTML = '';
                if(roomsTabList) roomsTabList.innerHTML = '';
                
                snap.forEach(c => {
                    const r = c.val();
                    const roomCard = `
                        <div class="p-3 bg-slate-900 border border-slate-800 rounded-2xl flex items-center justify-between">
                            <div><h4 class="font-semibold text-sm text-white">${r.title}</h4><p class="text-[10px] text-pink-400">Type: ${r.type.toUpperCase()} • Host: ${r.creatorName}</p></div>
                            <button onclick="joinRoom('${r.id}', '${r.title}', '${r.criteria}', '${r.type}')" class="bg-pink-600 px-3 py-1.5 rounded-lg text-xs font-semibold text-white">Join</button>
                        </div>`;
                    if(homeList) homeList.innerHTML += roomCard;
                    if(roomsTabList) roomsTabList.innerHTML += roomCard;
                });
            });
        }

        function logoutApp() {
            auth.signOut().then(() => { localStorage.clear(); location.reload(); });
        }
    </script>
</body>
</html>
